name: Test Blacktop API

on:
  workflow_dispatch:

jobs:
  test-blacktop:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Blacktop API
        env:
          BLACKTOP_API_KEY: ${{ secrets.BLACKTOP_API_KEY }}
        run: node js/test-blacktop.js

- name: Test Blacktop Location
  run: node js/test-blacktop-location.js
  env:
    BLACKTOP_API_KEY: ${{ secrets.BLACKTOP_API_KEY }}
