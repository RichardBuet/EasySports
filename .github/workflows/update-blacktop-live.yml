name: Update Blacktop F1 Live

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blacktop-live:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Blacktop Live data
        env:
          BLACKTOP_API_KEY: ${{ secrets.BLACKTOP_API_KEY }}
        run: node js/update-blacktop-live.js

      - name: Commit updated live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/f1-blacktop-live.json

          git diff --cached --quiet || git commit -m "Update F1 Blacktop live data"

          git push
