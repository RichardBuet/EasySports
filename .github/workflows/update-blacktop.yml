name: Update Blacktop F1

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * 5,6,0"

permissions:
  contents: write

jobs:
  update-blacktop:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Blacktop data
        env:
          BLACKTOP_API_KEY: ${{ secrets.BLACKTOP_API_KEY }}
        run: node js/update-blacktop.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/f1-blacktop.json

          git diff --cached --quiet || git commit -m "Update F1 Blacktop data"

          git push
